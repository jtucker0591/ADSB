name: Secret scan

# Backstop for the client-side pre-push hook (.githooks/pre-push): runs
# gitleaks against every push and PR so a leak is caught (and the repo
# owner notified via the failed-run email) even from a machine that never
# installed the hook, or a push made with --no-verify. Added after the
# 2026-09-21 incident where src/secrets.h.*.bak (real WiFi passwords for
# four networks) got committed and pushed to this public repo.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
